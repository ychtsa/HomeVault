name: homevault

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Microsoft SQL Server Linux images require x86-64. See deployment guide for ARM Macs.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env first}
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  app:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sql;Database=HomeVault;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Database__ApplyMigrations: "true"
      Storage__Provider: FileSystem
      DataProtection__KeysPath: /app/App_Data/keys
      ForwardedHeaders__Enabled: "true"
      ForwardedHeaders__TrustAllProxies: "true"
      Swagger__Enabled: "true"
    volumes:
      - app-data:/app/App_Data
    depends_on:
      sql:
        condition: service_healthy
    restart: unless-stopped

  https:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./infra/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sql-data:
  app-data:
  caddy-data:
  caddy-config:
